name: Database backup

# Nightly pg_dump of the Supabase database (the free plan has no backups).
# Setup: repo → Settings → Secrets and variables → Actions → SUPABASE_DB_URL = Session pooler URI.
on:
  schedule:
    - cron: "30 23 * * *" # 03:30 Tbilisi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump the app schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          file="alcodraft-$(date -u +%F).dump"
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --schema=app --schema=drizzle --no-owner --no-privileges --format=custom' > "$file"
          test -s "$file"
          ls -lh "$file"
          echo "FILE=$file" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          compression-level: 0
