name: Database backup

# Weekly pg_dump of the Supabase database, encrypted before it is stored.
# The repository is public and artifacts of public repos can be downloaded by anyone,
# so the dump is only ever uploaded as an AES-256 (gpg) file.
#
# Setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL    the Session pooler URI (port 5432), raw password is fine
#   BACKUP_PASSPHRASE  a long random passphrase; keep a copy in your password manager
# Without both secrets the job is skipped (no failure e-mails).
# Restore: see docs/deployment.md → Backups.
on:
  schedule:
    - cron: "30 23 * * 6" # Sunday 03:30 Tbilisi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backups are not configured (SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets). Skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Dump the app schema (encrypted)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          # Split the URI by hand (password = text between "user:" and the LAST "@"), so passwords
          # with @ # / ? % work without percent-encoding — same rule as src/server/db/connection-string.ts.
          rest="${SUPABASE_DB_URL#*://}"
          creds="${rest%@*}"
          hostpart="${rest##*@}"
          export PGUSER="${creds%%:*}"
          export PGPASSWORD="${creds#*:}"
          echo "::add-mask::$PGPASSWORD"
          hostport="${hostpart%%/*}"
          export PGHOST="${hostport%%:*}"
          if [ "$hostport" = "$PGHOST" ]; then export PGPORT=5432; else export PGPORT="${hostport##*:}"; fi
          db="${hostpart#*/}"; db="${db%%\?*}"
          if [ "$db" = "$hostpart" ] || [ -z "$db" ]; then db=postgres; fi
          export PGDATABASE="$db"
          export PGSSLMODE=require

          file="alcodraft-$(date -u +%F).dump"
          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17 \
            pg_dump --schema=app --schema=drizzle --no-owner --no-privileges --format=custom > "$file"
          test -s "$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$file.gpg" "$file"
          rm -f "$file"
          ls -lh "$file.gpg"
          echo "FILE=$file.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90 # the longest GitHub keeps an artifact: the last ~13 weeks
          compression-level: 0
